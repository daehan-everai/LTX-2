# Image-to-video Flow-DPO (Kling / VideoReward, constant beta).
#
# Requires a LoRA checkpoint in model.load_checkpoint. That adapter is both the
# frozen reference and the trainable policy initialization.

model:
  model_path: "path/to/ltx-2-dev.safetensors"
  text_encoder_path: "path/to/gemma-3-12b-it"
  training_mode: lora
  load_checkpoint: "path/to/sft_lora.safetensors"

lora:
  rank: 128
  alpha: 128
  dropout: 0.0
  target_modules:
    - to_k
    - to_q
    - to_v
    - to_out.0
  freeze_extra_modules: true

training_strategy:
  name: flow_dpo
  first_frame_conditioning_p: 1.0
  with_audio: false
  beta: 2.69897000434
  chosen_latents_dir: chosen_latents
  rejected_latents_dir: rejected_latents

optimization:
  learning_rate: 1.0e-5
  steps: 2000
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: adamw
  scheduler_type: linear
  scheduler_params:
    end_factor: 0.1
  enable_gradient_checkpointing: true
  gradient_checkpointing_ratio: 1.0

acceleration:
  mixed_precision_mode: bf16
  quantization: null
  load_text_encoder_in_8bit: false

data:
  preprocessed_data_root: "path/to/preprocessed/train"
  num_dataloader_workers: 4

validation:
  loss_data_root: null
  prompts: []
  images: null
  interval: null
  video_dims: [448, 768, 49]
  frame_rate: 24.0
  seed: 42
  inference_steps: 30
  guidance_scale: 4.0
  stg_scale: 1.0
  stg_blocks: [29]
  stg_mode: stg_v
  generate_audio: false
  skip_initial_validation: true

checkpoints:
  interval: 1000
  keep_last_n: 2
  precision: bfloat16
  no_resume: true
  save_training_state: minimal

flow_matching:
  timestep_sampling_mode: shifted_logit_normal
  timestep_sampling_params: {}
  timestep_loss_weighting: none

hub:
  push_to_hub: false
  hub_model_id: null

tensorboard:
  enabled: true
  log_dir: null

seed: 42
output_dir: "outputs/i2v_flow_dpo"
